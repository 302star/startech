<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>React Bits Showcase</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      background: #0a0a0f;
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      overflow-x: hidden;
    }

    .aurora-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .aurora-layer {
      position: absolute;
      inset: -20%;
      background:
        radial-gradient(ellipse 80% 50% at 20% 40%, rgba(82, 39, 255, 0.45) 0%, transparent 70%),
        radial-gradient(ellipse 60% 40% at 75% 60%, rgba(124, 255, 103, 0.35) 0%, transparent 70%),
        radial-gradient(ellipse 50% 30% at 50% 80%, rgba(82, 39, 255, 0.3) 0%, transparent 70%);
      animation: aurora-drift 12s ease-in-out infinite alternate;
    }

    .aurora-layer-2 {
      animation-duration: 16s;
      animation-delay: -4s;
      opacity: 0.7;
      filter: blur(40px);
    }

    @keyframes aurora-drift {
      0%   { transform: translate(0, 0) scale(1); }
      100% { transform: translate(5%, -3%) scale(1.08); }
    }

    .page {
      position: relative;
      z-index: 1;
      max-width: 960px;
      margin: 0 auto;
      padding: 4rem 1.5rem 6rem;
    }

    .badge {
      display: inline-block;
      font-size: 0.7rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.4);
      margin-bottom: 1.5rem;
    }

    .hero-title {
      font-size: clamp(2rem, 6vw, 3.5rem);
      font-weight: 700;
      line-height: 1.15;
      margin-bottom: 1rem;
      display: flex;
      flex-wrap: wrap;
    }

    .blur-word {
      display: inline-block;
      filter: blur(10px);
      opacity: 0;
      transform: translateY(-50px);
    }

    .blur-word.animate {
      animation: blur-reveal 0.7s ease forwards;
    }

    @keyframes blur-reveal {
      0%   { filter: blur(10px); opacity: 0; transform: translateY(-50px); }
      50%  { filter: blur(5px);  opacity: 0.5; transform: translateY(5px); }
      100% { filter: blur(0);    opacity: 1;   transform: translateY(0); }
    }

    .hero-subtitle {
      font-size: 1.1rem;
      color: rgba(255, 255, 255, 0.5);
      margin-bottom: 2.5rem;
      max-width: 520px;
    }

    .hero-subtitle a { color: #7cff67; }

    .text-pressure-section {
      width: 100%;
      height: 280px;
      margin-bottom: 3rem;
      border-radius: 1.5rem;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(17, 17, 17, 0.5);
      overflow: hidden;
      position: relative;
    }

    .text-pressure-hint {
      position: absolute;
      top: 1rem;
      left: 1.5rem;
      font-size: 0.75rem;
      color: rgba(255, 255, 255, 0.35);
      z-index: 2;
      letter-spacing: 0.05em;
    }

    .text-pressure-inner {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      padding: 0 1.5rem;
    }

    .shiny-wrap {
      font-size: clamp(1.5rem, 4vw, 2.25rem);
      font-weight: 600;
      margin-bottom: 3rem;
    }

    .shiny-text {
      display: inline-block;
      background-image: linear-gradient(120deg, #888 0%, #888 35%, #fff 50%, #888 65%, #888 100%);
      background-size: 200% auto;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: shine-sweep 3s linear infinite;
    }

    .shiny-text.paused { animation-play-state: paused; }

    @keyframes shine-sweep {
      0%   { background-position: 150% center; }
      100% { background-position: -50% center; }
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 1.5rem;
      margin-bottom: 3rem;
    }

    .card-spotlight {
      position: relative;
      border-radius: 1.5rem;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background-color: rgba(17, 17, 17, 0.7);
      padding: 2rem;
      overflow: hidden;
      --mouse-x: 50%;
      --mouse-y: 50%;
      --spotlight-color: rgba(255, 255, 255, 0.05);
    }

    .card-spotlight::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at var(--mouse-x) var(--mouse-y), var(--spotlight-color), transparent 80%);
      opacity: 0;
      transition: opacity 0.5s ease;
      pointer-events: none;
    }

    .card-spotlight:hover::before,
    .card-spotlight:focus-within::before { opacity: 0.6; }

    .card-spotlight h3 { font-size: 1.1rem; margin-bottom: 0.5rem; }
    .card-spotlight p  { font-size: 0.9rem; color: rgba(255, 255, 255, 0.5); line-height: 1.5; }
    .card-icon { font-size: 1.75rem; margin-bottom: 1rem; }

    .cta-section { text-align: center; margin-top: 2rem; }

    .cta-hint {
      font-size: 0.85rem;
      color: rgba(255, 255, 255, 0.35);
      margin-bottom: 1.25rem;
    }

    .star-border-container {
      display: inline-block;
      position: relative;
      border-radius: 20px;
      overflow: hidden;
      border: none;
      background: none;
      padding: 0;
      cursor: pointer;
    }

    .border-gradient-bottom {
      position: absolute;
      width: 300%;
      height: 50%;
      opacity: 0.7;
      bottom: -12px;
      right: -250%;
      border-radius: 50%;
      animation: star-movement-bottom linear infinite alternate;
      z-index: 0;
    }

    .border-gradient-top {
      position: absolute;
      opacity: 0.7;
      width: 300%;
      height: 50%;
      top: -12px;
      left: -250%;
      border-radius: 50%;
      animation: star-movement-top linear infinite alternate;
      z-index: 0;
    }

    .inner-content {
      position: relative;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(0, 0, 0, 0.6);
      color: white;
      font-size: 16px;
      text-align: center;
      padding: 16px 32px;
      border-radius: 20px;
      z-index: 1;
      transition: background 0.2s;
    }

    .inner-content:hover { background: rgba(255, 255, 255, 0.06); }

    @keyframes star-movement-bottom {
      0%   { transform: translate(0%, 0%); opacity: 1; }
      100% { transform: translate(-100%, 0%); opacity: 0; }
    }

    @keyframes star-movement-top {
      0%   { transform: translate(0%, 0%); opacity: 1; }
      100% { transform: translate(100%, 0%); opacity: 0; }
    }

    .footer {
      text-align: center;
      margin-top: 4rem;
      font-size: 0.8rem;
      color: rgba(255, 255, 255, 0.25);
    }

    .footer a { color: rgba(124, 255, 103, 0.7); text-decoration: none; }
    .footer a:hover { text-decoration: underline; }

    #load-error {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 999;
      background: #0a0a0f;
      color: #ff6b6b;
      padding: 2rem;
      font-family: monospace;
      font-size: 0.9rem;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <div id="load-error"></div>
  <div id="root"></div>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback, useMemo } = React;
    const { createRoot } = ReactDOM;

    // ÔöÇÔöÇ BlurText (reactbits.dev) ÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇ
    function BlurText({ text = '', delay = 200, className = '', animateBy = 'words', direction = 'top' }) {
      const elements = animateBy === 'words' ? text.split(' ') : text.split('');
      const [inView, setInView] = useState(false);
      const ref = useRef(null);

      useEffect(() => {
        const el = ref.current;
        if (!el) return;
        const observer = new IntersectionObserver(
          ([entry]) => {
            if (entry.isIntersecting) {
              setInView(true);
              observer.unobserve(el);
            }
          },
          { threshold: 0.1 }
        );
        observer.observe(el);
        return () => observer.disconnect();
      }, []);

      return (
        <p ref={ref} className={className}>
          {elements.map((segment, index) => (
            <span
              key={index}
              className={`blur-word${inView ? ' animate' : ''}`}
              style={{
                animationDelay: inView ? `${(index * delay) / 1000}s` : undefined,
                transform: direction === 'bottom' ? 'translateY(50px)' : undefined
              }}
            >
              {segment === ' ' ? '\u00A0' : segment}
              {animateBy === 'words' && index < elements.length - 1 && '\u00A0'}
            </span>
          ))}
        </p>
      );
    }

    // ÔöÇÔöÇ ShinyText (reactbits.dev) ÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇ
    function ShinyText({ text, pauseOnHover = false, className = '' }) {
      const [paused, setPaused] = useState(false);
      return (
        <span
          className={`shiny-text ${className}${paused ? ' paused' : ''}`}
          onMouseEnter={() => pauseOnHover && setPaused(true)}
          onMouseLeave={() => pauseOnHover && setPaused(false)}
        >
          {text}
        </span>
      );
    }

    // ÔöÇÔöÇ SpotlightCard (reactbits.dev) ÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇ
    function SpotlightCard({ children, className = '', spotlightColor = 'rgba(255, 255, 255, 0.25)' }) {
      const divRef = useRef(null);
      const handleMouseMove = e => {
        const rect = divRef.current.getBoundingClientRect();
        divRef.current.style.setProperty('--mouse-x', `${e.clientX - rect.left}px`);
        divRef.current.style.setProperty('--mouse-y', `${e.clientY - rect.top}px`);
        divRef.current.style.setProperty('--spotlight-color', spotlightColor);
      };
      return (
        <div ref={divRef} onMouseMove={handleMouseMove} className={`card-spotlight ${className}`}>
          {children}
        </div>
      );
    }

    // ÔöÇÔöÇ ClickSpark (reactbits.dev) ÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇ
    function ClickSpark({
      sparkColor = '#fff', sparkSize = 10, sparkRadius = 15,
      sparkCount = 8, duration = 400, easing = 'ease-out', extraScale = 1.0, children
    }) {
      const canvasRef = useRef(null);
      const sparksRef = useRef([]);

      const easeFunc = useCallback(t => {
        switch (easing) {
          case 'linear': return t;
          case 'ease-in': return t * t;
          case 'ease-in-out': return t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t;
          default: return t * (2 - t);
        }
      }, [easing]);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const parent = canvas.parentElement;
        if (!parent) return;

        const resizeCanvas = () => {
          const { width, height } = parent.getBoundingClientRect();
          canvas.width = width;
          canvas.height = height;
        };
        resizeCanvas();
        const ro = new ResizeObserver(resizeCanvas);
        ro.observe(parent);

        const ctx = canvas.getContext('2d');
        let animationId;

        const draw = timestamp => {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          sparksRef.current = sparksRef.current.filter(spark => {
            const elapsed = timestamp - spark.startTime;
            if (elapsed >= duration) return false;
            const progress = elapsed / duration;
            const eased = easeFunc(progress);
            const distance = eased * sparkRadius * extraScale;
            const lineLength = sparkSize * (1 - eased);
            const x1 = spark.x + distance * Math.cos(spark.angle);
            const y1 = spark.y + distance * Math.sin(spark.angle);
            const x2 = spark.x + (distance + lineLength) * Math.cos(spark.angle);
            const y2 = spark.y + (distance + lineLength) * Math.sin(spark.angle);
            ctx.strokeStyle = sparkColor;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(x1, y1);
            ctx.lineTo(x2, y2);
            ctx.stroke();
            return true;
          });
          animationId = requestAnimationFrame(draw);
        };
        animationId = requestAnimationFrame(draw);

        return () => { ro.disconnect(); cancelAnimationFrame(animationId); };
      }, [sparkColor, sparkSize, sparkRadius, duration, easeFunc, extraScale]);

      const handleClick = e => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const rect = canvas.getBoundingClientRect();
        const now = performance.now();
        sparksRef.current.push(...Array.from({ length: sparkCount }, (_, i) => ({
          x: e.clientX - rect.left,
          y: e.clientY - rect.top,
          angle: (2 * Math.PI * i) / sparkCount,
          startTime: now
        })));
      };

      return (
        <div style={{ position: 'relative', display: 'inline-block' }} onClick={handleClick}>
          <canvas ref={canvasRef} style={{
            position: 'absolute', width: '100%', height: '100%',
            top: 0, left: 0, pointerEvents: 'none', zIndex: 10
          }} />
          {children}
        </div>
      );
    }

    // ÔöÇÔöÇ StarBorder (reactbits.dev) ÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇ
    function StarBorder({ className = '', color = 'white', speed = '6s', thickness = 1, children, ...rest }) {
      return (
        <button
          className={`star-border-container ${className}`}
          style={{ padding: `${thickness}px 0` }}
          {...rest}
        >
          <div className="border-gradient-bottom" style={{
            background: `radial-gradient(circle, ${color}, transparent 10%)`,
            animationDuration: speed
          }} />
          <div className="border-gradient-top" style={{
            background: `radial-gradient(circle, ${color}, transparent 10%)`,
            animationDuration: speed
          }} />
          <div className="inner-content">{children}</div>
        </button>
      );
    }

    // ÔöÇÔöÇ TextPressure (reactbits.dev) ÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇ
    const dist = (a, b) => {
      const dx = b.x - a.x;
      const dy = b.y - a.y;
      return Math.sqrt(dx * dx + dy * dy);
    };

    const getAttr = (distance, maxDist, minVal, maxVal) => {
      const val = maxVal - Math.abs((maxVal * distance) / maxDist);
      return Math.max(minVal, val + minVal);
    };

    const debounce = (func, delay) => {
      let timeoutId;
      return (...args) => {
        clearTimeout(timeoutId);
        timeoutId = setTimeout(() => func(...args), delay);
      };
    };

    function TextPressure({
      text = 'Compressa',
      fontFamily = 'Compressa VF',
      fontUrl = 'https://res.cloudinary.com/dr6lvwubh/raw/upload/v1529908256/CompressaPRO-GX.woff2',
      width = true,
      weight = true,
      italic = true,
      alpha = false,
      flex = true,
      stroke = false,
      scale = false,
      textColor = '#FFFFFF',
      strokeColor = '#FF0000',
      className = '',
      minFontSize = 24
    }) {
      const containerRef = useRef(null);
      const titleRef = useRef(null);
      const spansRef = useRef([]);
      const mouseRef = useRef({ x: 0, y: 0 });
      const cursorRef = useRef({ x: 0, y: 0 });
      const [fontSize, setFontSize] = useState(minFontSize);
      const [scaleY, setScaleY] = useState(1);
      const [lineHeight, setLineHeight] = useState(1);
      const chars = text.split('');

      useEffect(() => {
        const handleMouseMove = e => {
          cursorRef.current.x = e.clientX;
          cursorRef.current.y = e.clientY;
        };
        const handleTouchMove = e => {
          const t = e.touches[0];
          cursorRef.current.x = t.clientX;
          cursorRef.current.y = t.clientY;
        };

        window.addEventListener('mousemove', handleMouseMove);
        window.addEventListener('touchmove', handleTouchMove, { passive: true });

        if (containerRef.current) {
          const { left, top, width: w, height: h } = containerRef.current.getBoundingClientRect();
          mouseRef.current.x = left + w / 2;
          mouseRef.current.y = top + h / 2;
          cursorRef.current.x = mouseRef.current.x;
          cursorRef.current.y = mouseRef.current.y;
        }

        return () => {
          window.removeEventListener('mousemove', handleMouseMove);
          window.removeEventListener('touchmove', handleTouchMove);
        };
      }, []);

      const setSize = useCallback(() => {
        if (!containerRef.current || !titleRef.current) return;
        const { width: containerW, height: containerH } = containerRef.current.getBoundingClientRect();
        let newFontSize = containerW / (chars.length / 2);
        newFontSize = Math.max(newFontSize, minFontSize);
        setFontSize(newFontSize);
        setScaleY(1);
        setLineHeight(1);

        requestAnimationFrame(() => {
          if (!titleRef.current) return;
          const textRect = titleRef.current.getBoundingClientRect();
          if (scale && textRect.height > 0) {
            const yRatio = containerH / textRect.height;
            setScaleY(yRatio);
            setLineHeight(yRatio);
          }
        });
      }, [chars.length, minFontSize, scale]);

      useEffect(() => {
        const debouncedSetSize = debounce(setSize, 100);
        debouncedSetSize();
        window.addEventListener('resize', debouncedSetSize);
        return () => window.removeEventListener('resize', debouncedSetSize);
      }, [setSize]);

      useEffect(() => {
        let rafId;
        const animate = () => {
          mouseRef.current.x += (cursorRef.current.x - mouseRef.current.x) / 15;
          mouseRef.current.y += (cursorRef.current.y - mouseRef.current.y) / 15;

          if (titleRef.current) {
            const titleRect = titleRef.current.getBoundingClientRect();
            const maxDist = titleRect.width / 2;

            spansRef.current.forEach(span => {
              if (!span) return;
              const rect = span.getBoundingClientRect();
              const charCenter = { x: rect.x + rect.width / 2, y: rect.y + rect.height / 2 };
              const d = dist(mouseRef.current, charCenter);
              const wdth = width ? Math.floor(getAttr(d, maxDist, 5, 200)) : 100;
              const wght = weight ? Math.floor(getAttr(d, maxDist, 100, 900)) : 400;
              const italVal = italic ? getAttr(d, maxDist, 0, 1).toFixed(2) : 0;
              const alphaVal = alpha ? getAttr(d, maxDist, 0, 1).toFixed(2) : 1;
              const newFontVariationSettings = `'wght' ${wght}, 'wdth' ${wdth}, 'ital' ${italVal}`;

              if (span.style.fontVariationSettings !== newFontVariationSettings) {
                span.style.fontVariationSettings = newFontVariationSettings;
              }
              if (alpha && span.style.opacity !== alphaVal) {
                span.style.opacity = alphaVal;
              }
            });
          }

          rafId = requestAnimationFrame(animate);
        };
        animate();
        return () => cancelAnimationFrame(rafId);
      }, [width, weight, italic, alpha]);

      const styleElement = useMemo(() => (
        <style>{`
          @font-face {
            font-family: '${fontFamily}';
            src: url('${fontUrl}');
            font-style: normal;
          }
          .text-pressure-flex { display: flex; justify-content: space-between; }
          .text-pressure-stroke span { position: relative; color: ${textColor}; }
          .text-pressure-stroke span::after {
            content: attr(data-char);
            position: absolute;
            left: 0; top: 0;
            color: transparent;
            z-index: -1;
            -webkit-text-stroke-width: 3px;
            -webkit-text-stroke-color: ${strokeColor};
          }
          .text-pressure-title { color: ${textColor}; }
        `}</style>
      ), [fontFamily, fontUrl, textColor, strokeColor]);

      const dynamicClassName = [
        'text-pressure-title',
        className,
        flex ? 'text-pressure-flex' : '',
        stroke ? 'text-pressure-stroke' : ''
      ].filter(Boolean).join(' ');

      return (
        <div ref={containerRef} style={{ position: 'relative', width: '100%', height: '100%' }}>
          {styleElement}
          <h1
            ref={titleRef}
            className={dynamicClassName}
            style={{
              fontFamily,
              fontSize,
              lineHeight,
              transform: `scale(1, ${scaleY})`,
              transformOrigin: 'center top',
              margin: 0,
              fontWeight: 100,
              fontStyle: 'normal',
              width: '100%',
