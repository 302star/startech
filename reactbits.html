<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>TextPressure Only</title>
  <style>
    html,body{height:100%;margin:0;background:#0a0a0f;color:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial}
    #root{min-height:100vh;display:flex;align-items:center;justify-content:center}
    .text-pressure-container{width:100%;max-width:900px;height:260px;padding:20px;box-sizing:border-box}
    .text-pressure-container h1{margin:0;white-space:nowrap;line-height:1;font-weight:600}
    .text-pressure-container span{display:inline-block;will-change:transform,opacity}
  </style>
</head>
<body>
  <div id="root"></div>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script>
  (function(){
    const React = window.React;
    const ReactDOM = window.ReactDOM;
    const { useState, useEffect, useRef } = React;

    function TextPressure(props){
      const { text = 'STAR', minFontSize = 12 } = props || {};
      const containerRef = useRef(null);
      const titleRef = useRef(null);
      const spansRef = useRef([]);
      const mouseRef = useRef({ x: 0, y: 0 });
      const cursorRef = useRef({ x: 0, y: 0 });
      const [fontSize, setFontSize] = useState(minFontSize);

      useEffect(()=>{
        function onMove(e){
          const x = e.touches ? e.touches[0].clientX : e.clientX;
          const y = e.touches ? e.touches[0].clientY : e.clientY;
          cursorRef.current.x = x; cursorRef.current.y = y;
        }
        window.addEventListener('mousemove', onMove);
        window.addEventListener('touchmove', onMove, { passive: true });
        if(containerRef.current){
          const rect = containerRef.current.getBoundingClientRect();
          mouseRef.current.x = rect.left + rect.width/2;
          mouseRef.current.y = rect.top + rect.height/2;
          cursorRef.current.x = mouseRef.current.x; cursorRef.current.y = mouseRef.current.y;
        }
        return ()=>{ window.removeEventListener('mousemove', onMove); window.removeEventListener('touchmove', onMove); };
      }, []);

      useEffect(()=>{
        function setSize(){
          if(!containerRef.current || !titleRef.current) return;
          const { width: cw, height: ch } = containerRef.current.getBoundingClientRect();
          let fs = Math.floor(cw / (Math.max(1, text.length) * 0.8));
          const maxFs = Math.max(12, Math.floor(ch * 0.7));
          fs = Math.min(fs, maxFs);
          fs = Math.max(fs, minFontSize);
          setFontSize(fs);
        }
        setSize();
        window.addEventListener('resize', setSize);
        return ()=> window.removeEventListener('resize', setSize);
      }, [text, minFontSize]);

      useEffect(()=>{
        let raf;
        function animate(){
          mouseRef.current.x += (cursorRef.current.x - mouseRef.current.x) / 12;
          mouseRef.current.y += (cursorRef.current.y - mouseRef.current.y) / 12;
          if(titleRef.current){
            const titleRect = titleRef.current.getBoundingClientRect();
            const maxDist = Math.max(80, titleRect.width / 2);
            spansRef.current.forEach(span => {
              if(!span) return;
              const rect = span.getBoundingClientRect();
              const cx = rect.left + rect.width/2;
              const cy = rect.top + rect.height/2;
              const dx = mouseRef.current.x - cx;
              const dy = mouseRef.current.y - cy;
              const d = Math.sqrt(dx*dx + dy*dy);
              const proximity = Math.max(0, 1 - d / maxDist);
              const scale = 1 - 0.25 * proximity; // shrink up to 25%
              span.style.transform = 'scale(' + scale + ')';
              span.style.transition = 'transform 120ms ease';
              span.style.opacity = String(0.6 + 0.4 * (1 - proximity));
            });
          }
          raf = requestAnimationFrame(animate);
        }
        raf = requestAnimationFrame(animate);
        return ()=> cancelAnimationFrame(raf);
      }, [fontSize, text]);

      const chars = text.split('');
      const spanChildren = chars.map(function(ch, i){
        return React.createElement('span', { key: i, ref: el => spansRef.current[i] = el, 'data-char': ch, style: { display: 'inline-block', marginRight: '2px' } }, ch);
      });

      return React.createElement('div', { ref: containerRef, className: 'text-pressure-container', style: { width: '100%', maxWidth: '900px', height: '240px', padding: '20px', boxSizing: 'border-box' } },
        React.createElement('h1', { ref: titleRef, style: { fontSize: fontSize + 'px', margin:0, whiteSpace: 'nowrap', lineHeight: 1 } }, spanChildren)
      );
    }

    document.addEventListener('DOMContentLoaded', function(){
      const root = document.getElementById('root');
      ReactDOM.createRoot(root).render(React.createElement(TextPressure, { text: 'STAR', minFontSize: 12 }));
    });
  })();
  </script>
</body>
</html>
