<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>TextPressure Only</title>
  <style>
    html,body{height:100%;margin:0;background:#0a0a0f;color:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial}
    #root{min-height:100vh;display:flex;align-items:center;justify-content:center}
    .text-pressure-container{width:100%;max-width:900px;height:260px;padding:20px;box-sizing:border-box}
    .text-pressure-container h1{margin:0;white-space:nowrap;line-height:1;font-weight:600}
    .text-pressure-container span{display:inline-block;will-change:transform,opacity}
  </style>
</head>
<body>
  <div id="root"></div>

  <script>
  (function(){
    // Try to use React if available; otherwise fall back to a pure-DOM TextPressure implementation
    const hasReact = !!(window.React && window.ReactDOM && window.ReactDOM.createRoot);

    // helpers
    function dist(a, b){ const dx = b.x - a.x; const dy = b.y - a.y; return Math.sqrt(dx*dx + dy*dy); }
    function getAttr(distance, maxDist, minVal, maxVal){ const val = maxVal - Math.abs((maxVal * distance) / maxDist); return Math.max(minVal, val + minVal); }
    function debounce(func, delay){ let timeoutId; return (...args)=>{ clearTimeout(timeoutId); timeoutId = setTimeout(()=>func(...args), delay); }; }

    // The original TextPressure React component logic (extracted) - used for DOM fallback
    function createDOMTextPressure(opts){
      const {
        text = 'STAR',
        fontFamily = 'Compressa VF',
        fontUrl = 'https://res.cloudinary.com/dr6lvwubh/raw/upload/v1529908256/CompressaPRO-GX.woff2',
        width=true, weight=true, italic=true, alpha=false, flex=true, stroke=false, scale=false,
        textColor='#FFFFFF', strokeColor='#FF0000', minFontSize=24
      } = opts || {};

      // container
      const container = document.createElement('div'); container.className = 'text-pressure-container';
      container.style.width = '100%'; container.style.maxWidth = '900px'; container.style.height = '240px'; container.style.padding = '20px'; container.style.boxSizing = 'border-box';

      // inject font-face
      if(fontUrl){
        const s = document.createElement('style');
        s.textContent = "@font-face{ font-family: '"+fontFamily+"'; src: url('"+fontUrl+"'); font-style: normal; }";
        document.head.appendChild(s);
      }

      const h1 = document.createElement('h1');
      h1.style.margin = '0'; h1.style.whiteSpace = 'nowrap'; h1.style.lineHeight = '1'; h1.style.fontWeight = '100';
      container.appendChild(h1);

      const chars = text.split('');
      const spans = [];
      chars.forEach((ch, i)=>{
        const sp = document.createElement('span');
        sp.textContent = ch;
        sp.setAttribute('data-char', ch);
        sp.style.display = 'inline-block';
        sp.style.color = textColor;
        sp.style.marginRight = '0.1em';
        h1.appendChild(sp);
        spans.push(sp);
      });

      // sizing
      function setSize(){
        const rect = container.getBoundingClientRect();
        const containerW = rect.width; const containerH = rect.height;
        let newFontSize = containerW / Math.max(1, chars.length / 2);
        const maxFs = Math.max(12, Math.floor(containerH * 0.7));
        newFontSize = Math.min(newFontSize, maxFs);
        newFontSize = Math.max(newFontSize, minFontSize);
        h1.style.fontSize = newFontSize + 'px';
      }
      setSize();
      window.addEventListener('resize', debounce(setSize, 100));

      // pointer tracking
      const cursor = { x: window.innerWidth/2, y: window.innerHeight/2 };
      const mouse = { x: cursor.x, y: cursor.y };
      window.addEventListener('mousemove', e=>{ cursor.x = e.clientX; cursor.y = e.clientY; });
      window.addEventListener('touchmove', e=>{ const t = e.touches[0]; if(t){ cursor.x = t.clientX; cursor.y = t.clientY; } }, { passive: true });

      // animation loop
      let rafId;
      function animate(){
        mouse.x += (cursor.x - mouse.x)/15; mouse.y += (cursor.y - mouse.y)/15;
        const titleRect = h1.getBoundingClientRect();
        const maxDist = Math.max(80, titleRect.width/2);
        spans.forEach(sp=>{
          const rect = sp.getBoundingClientRect();
          const charCenter = { x: rect.left + rect.width/2, y: rect.top + rect.height/2 };
          const d = dist(mouse, charCenter);
          const wdth = width ? Math.floor(getAttr(d, maxDist, 5, 200)) : 100;
          const wght = weight ? Math.floor(getAttr(d, maxDist, 100, 900)) : 400;
          const italVal = italic ? getAttr(d, maxDist, 0, 1).toFixed(2) : 0;
          const alphaVal = alpha ? getAttr(d, maxDist, 0, 1).toFixed(2) : 1;
          const fv = "'wght' " + wght + ", 'wdth' " + wdth + ", 'ital' " + italVal;
          sp.style.fontVariationSettings = fv;
          if(alpha) sp.style.opacity = alphaVal;
        });
        rafId = requestAnimationFrame(animate);
      }
      rafId = requestAnimationFrame(animate);

      return container;
    }

    if(hasReact){
      try{
        const React = window.React;
        const ReactDOM = window.ReactDOM;
        const root = document.getElementById('root');
        const { createElement } = React;
        const tp = React.createElement.bind(null);
        // reconstruct original React component mount using inline createElement approach
        function App(){ return React.createElement('div', null, React.createElement('div', { className: 'text-pressure-inner' }, React.createElement('div', { style: { width: '100%', height: '240px' } }, React.createElement(React.Fragment, null)))); }
        // fallback: mount TextPressure using DOM
        ReactDOM.createRoot(document.getElementById('root')).render(React.createElement('div', null));
        // replace with DOM TextPressure (ensures visible output)
        const dom = createDOMTextPressure({ text: 'STAR', minFontSize: 12 });
        const rootEl = document.getElementById('root'); rootEl.innerHTML = ''; rootEl.appendChild(dom);
      }catch(e){
        // on any react error, mount DOM fallback
        const rootEl = document.getElementById('root'); rootEl.innerHTML = ''; rootEl.appendChild(createDOMTextPressure({ text: 'STAR', minFontSize: 12 }));
      }
    }else{
      // No React available — use DOM fallback
      const rootEl = document.getElementById('root'); rootEl.innerHTML = ''; rootEl.appendChild(createDOMTextPressure({ text: 'STAR', minFontSize: 12 }));
    }
  })();
  </script>
</body>
</html>
