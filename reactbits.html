<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>TextPressure Only</title>
  <style>
    html,body{height:100%;margin:0;background:#0a0a0f;color:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial}
    #root{min-height:100vh;display:flex;align-items:center;justify-content:center}
    .text-pressure-container{width:100%;max-width:900px;height:260px;padding:20px;box-sizing:border-box}
    .text-pressure-container h1{margin:0;white-space:nowrap;line-height:1;font-weight:600}
    .text-pressure-container span{display:inline-block;will-change:transform,opacity}
  </style>
</head>
<body>
  <div id="root"></div>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script>
  (function(){
    const React = window.React;
    const ReactDOM = window.ReactDOM;
    const { useState, useEffect, useRef } = React;

    // helpers used by TextPressure
    const dist = (a, b) => { const dx = b.x - a.x; const dy = b.y - a.y; return Math.sqrt(dx*dx + dy*dy); };
    const getAttr = (distance, maxDist, minVal, maxVal) => { const val = maxVal - Math.abs((maxVal * distance) / maxDist); return Math.max(minVal, val + minVal); };
    const debounce = (func, delay) => { let timeoutId; return (...args) => { clearTimeout(timeoutId); timeoutId = setTimeout(() => func(...args), delay); }; };

    function TextPressure({ text = 'Compressa', fontFamily = 'Compressa VF', fontUrl = 'https://res.cloudinary.com/dr6lvwubh/raw/upload/v1529908256/CompressaPRO-GX.woff2', width = true, weight = true, italic = true, alpha = false, flex = true, stroke = false, scale = false, textColor = '#FFFFFF', strokeColor = '#FF0000', className = '', minFontSize = 24 }) {
      const containerRef = useRef(null);
      const titleRef = useRef(null);
      const spansRef = useRef([]);
      const mouseRef = useRef({ x: 0, y: 0 });
      const cursorRef = useRef({ x: 0, y: 0 });
      const [fontSize, setFontSize] = useState(minFontSize);
      const [scaleY, setScaleY] = useState(1);
      const [lineHeight, setLineHeight] = useState(1);
      const chars = text.split('');

      useEffect(() => {
        const handleMouseMove = e => { cursorRef.current.x = e.clientX; cursorRef.current.y = e.clientY; };
        const handleTouchMove = e => { const t = e.touches[0]; cursorRef.current.x = t.clientX; cursorRef.current.y = t.clientY; };
        window.addEventListener('mousemove', handleMouseMove);
        window.addEventListener('touchmove', handleTouchMove, { passive: true });
        if (containerRef.current) {
          const rect = containerRef.current.getBoundingClientRect();
          mouseRef.current.x = rect.left + rect.width / 2; mouseRef.current.y = rect.top + rect.height / 2; cursorRef.current.x = mouseRef.current.x; cursorRef.current.y = mouseRef.current.y;
        }
        return () => { window.removeEventListener('mousemove', handleMouseMove); window.removeEventListener('touchmove', handleTouchMove); };
      }, []);

      const setSize = useCallback(() => {
        if (!containerRef.current || !titleRef.current) return;
        const { width: containerW, height: containerH } = containerRef.current.getBoundingClientRect();
        let newFontSize = containerW / (chars.length / 2);
        newFontSize = Math.max(newFontSize, minFontSize);
        setFontSize(newFontSize);
        setScaleY(1); setLineHeight(1);
        requestAnimationFrame(() => { if (!titleRef.current) return; const textRect = titleRef.current.getBoundingClientRect(); if (scale && textRect.height > 0) { const yRatio = containerH / textRect.height; setScaleY(yRatio); setLineHeight(yRatio); } });
      }, [chars.length, minFontSize, scale]);

      useEffect(() => { const debouncedSetSize = debounce(setSize, 100); debouncedSetSize(); window.addEventListener('resize', debouncedSetSize); return () => window.removeEventListener('resize', debouncedSetSize); }, [setSize]);

      useEffect(() => {
        let rafId;
        const animate = () => {
          mouseRef.current.x += (cursorRef.current.x - mouseRef.current.x) / 15;
          mouseRef.current.y += (cursorRef.current.y - mouseRef.current.y) / 15;
          if (titleRef.current) {
            const titleRect = titleRef.current.getBoundingClientRect(); const maxDist = titleRect.width / 2;
            spansRef.current.forEach(span => { if (!span) return; const rect = span.getBoundingClientRect(); const charCenter = { x: rect.x + rect.width / 2, y: rect.y + rect.height / 2 }; const d = dist(mouseRef.current, charCenter); const wdth = width ? Math.floor(getAttr(d, maxDist, 5, 200)) : 100; const wght = weight ? Math.floor(getAttr(d, maxDist, 100, 900)) : 400; const italVal = italic ? getAttr(d, maxDist, 0, 1).toFixed(2) : 0; const alphaVal = alpha ? getAttr(d, maxDist, 0, 1).toFixed(2) : 1; const newFontVariationSettings = `'wght' ${wght}, 'wdth' ${wdth}, 'ital' ${italVal}`; if (span.style.fontVariationSettings !== newFontVariationSettings) span.style.fontVariationSettings = newFontVariationSettings; if (alpha && span.style.opacity !== alphaVal) span.style.opacity = alphaVal; });
          }
          rafId = requestAnimationFrame(animate);
        };
        animate(); return () => cancelAnimationFrame(rafId);
      }, [width, weight, italic, alpha]);

      const styleString = "@font-face{ font-family: '"+fontFamily+"'; src: url('"+fontUrl+"'); font-style: normal; } .text-pressure-flex{display:flex;justify-content:space-between;} .text-pressure-stroke span{position:relative;color:"+textColor+";} .text-pressure-stroke span::after{ content: attr(data-char); position:absolute; left:0; top:0; color: transparent; z-index:-1; -webkit-text-stroke-width:3px; -webkit-text-stroke-color: "+strokeColor+"; } .text-pressure-title{ color: "+textColor+"; }";
      const styleEl = React.createElement('style', null, styleString);

      const dynamicClassName = ['text-pressure-title', className, flex ? 'text-pressure-flex' : '', stroke ? 'text-pressure-stroke' : ''].filter(Boolean).join(' ');

      const spanChildren = chars.map(function(char,i){
        return React.createElement('span', { key: i, ref: function(el){ spansRef.current[i] = el; }, 'data-char': char, style: { display: 'inline-block', color: stroke ? undefined : textColor } }, char);
      });

      const h1Style = Object.assign({ fontFamily: fontFamily, fontSize: fontSize, lineHeight: lineHeight, transform: 'scale(1, ' + scaleY + ')', transformOrigin: 'center top', margin: 0, fontWeight: 100, fontStyle: 'normal', width: '100%' }, (flex ? {} : { whiteSpace: 'nowrap' }));

      return React.createElement('div', { ref: containerRef, style: { position: 'relative', width: '100%', height: '100%' } }, styleEl, React.createElement('h1', { ref: titleRef, className: dynamicClassName, style: h1Style }, spanChildren));
    }

    document.addEventListener('DOMContentLoaded', function(){
      const root = document.getElementById('root');
      ReactDOM.createRoot(root).render(React.createElement(TextPressure, { text: 'STAR', minFontSize: 12 }));
    });
  })();
  </script>
</body>
</html>
