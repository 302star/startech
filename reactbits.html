<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TextPressure Demo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      background: #0a0a0f;
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      overflow-x: hidden;
    }

    .aurora-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .aurora-layer {
      position: absolute;
      inset: -20%;
      background:
        radial-gradient(ellipse 80% 50% at 20% 40%, rgba(82, 39, 255, 0.45) 0%, transparent 70%),
        radial-gradient(ellipse 60% 40% at 75% 60%, rgba(124, 255, 103, 0.35) 0%, transparent 70%),
        radial-gradient(ellipse 50% 30% at 50% 80%, rgba(82, 39, 255, 0.3) 0%, transparent 70%);
      animation: aurora-drift 12s ease-in-out infinite alternate;
    }

    .aurora-layer-2 {
      animation-duration: 16s;
      animation-delay: -4s;
      opacity: 0.7;
      filter: blur(40px);
    }

    @keyframes aurora-drift {
      0%   { transform: translate(0, 0) scale(1); }
      100% { transform: translate(5%, -3%) scale(1.08); }
    }

    .page {
      position: relative;
      z-index: 1;
      max-width: 960px;
      margin: 0 auto;
      padding: 4rem 1.5rem 6rem;
    }

    .text-pressure-section {
      width: 100%;
      height: 200px;
      margin-bottom: 3rem;
      border-radius: 1.5rem;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(17, 17, 17, 0.5);
      overflow: hidden;
      position: relative;
    }

    .text-pressure-inner {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      padding: 0 1.5rem;
    }

    .footer {
      text-align: center;
      margin-top: 4rem;
      font-size: 0.8rem;
      color: rgba(255, 255, 255, 0.25);
    }

    .footer a { color: rgba(124, 255, 103, 0.7); text-decoration: none; }
    .footer a:hover { text-decoration: underline; }

    .ascii-text-section {
      position: relative;
      width: 100%;
      height: 300px;
      margin-bottom: 3rem;
    }

    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&display=swap');

    .ascii-text-container canvas {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      image-rendering: optimizeSpeed;
      image-rendering: -moz-crisp-edges;
      image-rendering: -o-crisp-edges;
      image-rendering: -webkit-optimize-contrast;
      image-rendering: optimize-contrast;
      image-rendering: crisp-edges;
      image-rendering: pixelated;
    }

    .ascii-text-container pre {
      margin: 0;
      user-select: none;
      padding: 0;
      line-height: 1em;
      text-align: left;
      position: absolute;
      left: 0;
      top: 0;
      background-image: radial-gradient(circle, #ff6188 0%, #fc9867 50%, #ffd866 100%);
      background-attachment: fixed;
      -webkit-text-fill-color: transparent;
      -webkit-background-clip: text;
      z-index: 9;
      mix-blend-mode: difference;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback, useMemo } = React;
    const { createRoot } = ReactDOM;

    // ── ASCIIText Component (from reactbits.dev) ──────────────────────────────────────

    Math.map = function (n, start, stop, start2, stop2) {
      return ((n - start) / (stop - start)) * (stop2 - start2) + start2;
    };

    const PX_RATIO = typeof window !== 'undefined' ? window.devicePixelRatio : 1;

    class AsciiFilter {
      constructor(renderer, { fontSize, fontFamily, charset, invert } = {}) {
        this.renderer = renderer;
        this.domElement = document.createElement('div');
        this.domElement.style.position = 'absolute';
        this.domElement.style.top = '0';
        this.domElement.style.left = '0';
        this.domElement.style.width = '100%';
        this.domElement.style.height = '100%';

        this.pre = document.createElement('pre');
        this.domElement.appendChild(this.pre);

        this.canvas = document.createElement('canvas');
        this.context = this.canvas.getContext('2d');
        this.domElement.appendChild(this.canvas);

        this.deg = 0;
        this.invert = invert ?? true;
        this.fontSize = fontSize ?? 12;
        this.fontFamily = fontFamily ?? "'Courier New', monospace";
        this.charset = charset ?? ' .\'`^",:;Il!i~+_-?][}{1)(|/tfjrxnuvczXYUJCLQ0OZmwqpdbkhao*#MW&8%B@$';

        this.context.webkitImageSmoothingEnabled = false;
        this.context.mozImageSmoothingEnabled = false;
        this.context.msImageSmoothingEnabled = false;
        this.context.imageSmoothingEnabled = false;

        this.onMouseMove = this.onMouseMove.bind(this);
        document.addEventListener('mousemove', this.onMouseMove);
      }

      setSize(width, height) {
        this.width = width;
        this.height = height;
        this.renderer.setSize(width, height);
        this.reset();

        this.center = { x: width / 2, y: height / 2 };
        this.mouse = { x: this.center.x, y: this.center.y };
      }

      reset() {
        this.context.font = `${this.fontSize}px ${this.fontFamily}`;
        const charWidth = this.context.measureText('A').width;

        this.cols = Math.floor(this.width / (this.fontSize * (charWidth / this.fontSize)));
        this.rows = Math.floor(this.height / this.fontSize);

        this.canvas.width = this.cols;
        this.canvas.height = this.rows;
        this.pre.style.fontFamily = this.fontFamily;
        this.pre.style.fontSize = `${this.fontSize}px`;
        this.pre.style.margin = '0';
        this.pre.style.padding = '0';
        this.pre.style.lineHeight = '1em';
        this.pre.style.position = 'absolute';
        this.pre.style.left = '0';
        this.pre.style.top = '0';
        this.pre.style.zIndex = '9';
        this.pre.style.backgroundAttachment = 'fixed';
        this.pre.style.mixBlendMode = 'difference';
      }

      render(scene, camera) {
        this.renderer.render(scene, camera);

        const w = this.canvas.width;
        const h = this.canvas.height;
        this.context.clearRect(0, 0, w, h);
        if (this.context && w && h) {
          this.context.drawImage(this.renderer.domElement, 0, 0, w, h);
        }

        this.asciify(this.context, w, h);
        this.hue();
      }

      onMouseMove(e) {
        this.mouse = { x: e.clientX * PX_RATIO, y: e.clientY * PX_RATIO };
      }

      get dx() {
        return this.mouse.x - this.center.x;
      }

      get dy() {
        return this.mouse.y - this.center.y;
      }

      hue() {
        const deg = (Math.atan2(this.dy, this.dx) * 180) / Math.PI;
        this.deg += (deg - this.deg) * 0.075;
        this.domElement.style.filter = `hue-rotate(${this.deg.toFixed(1)}deg)`;
      }

      asciify(ctx, w, h) {
        if (w && h) {
          const imgData = ctx.getImageData(0, 0, w, h).data;
          let str = '';
          for (let y = 0; y < h; y++) {
            for (let x = 0; x < w; x++) {
              const i = x * 4 + y * 4 * w;
              const [r, g, b, a] = [imgData[i], imgData[i + 1], imgData[i + 2], imgData[i + 3]];

              if (a === 0) {
                str += ' ';
                continue;
              }

              let gray = (0.3 * r + 0.6 * g + 0.1 * b) / 255;
              let idx = Math.floor((1 - gray) * (this.charset.length - 1));
              if (this.invert) idx = this.charset.length - idx - 1;
              str += this.charset[idx];
            }
            str += '\n';
          }
          this.pre.innerHTML = str;
        }
      }

      dispose() {
        document.removeEventListener('mousemove', this.onMouseMove);
      }
    }

    class CanvasTxt {
      constructor(txt, { fontSize = 200, fontFamily = 'Arial', color = '#fdf9f3' } = {}) {
        this.canvas = document.createElement('canvas');
        this.context = this.canvas.getContext('2d');
        this.txt = txt;
        this.fontSize = fontSize;
        this.fontFamily = fontFamily;
        this.color = color;

        this.font = `600 ${this.fontSize}px ${this.fontFamily}`;
      }

      resize() {
        this.context.font = this.font;
        const metrics = this.context.measureText(this.txt);

        const textWidth = Math.ceil(metrics.width) + 20;
        const textHeight = Math.ceil(metrics.actualBoundingBoxAscent + metrics.actualBoundingBoxDescent) + 20;

        this.canvas.width = textWidth;
        this.canvas.height = textHeight;
      }

      render() {
        this.context.clearRect(0, 0, this.canvas.width, this.canvas.height);
        this.context.fillStyle = this.color;
        this.context.font = this.font;

        const metrics = this.context.measureText(this.txt);
        const yPos = 10 + metrics.actualBoundingBoxAscent;

        this.context.fillText(this.txt, 10, yPos);
      }

      get width() {
        return this.canvas.width;
      }

      get height() {
        return this.canvas.height;
      }

      get texture() {
        return this.canvas;
      }
    }

    class CanvAscii {
      constructor(
        { text, asciiFontSize, textFontSize, textColor, planeBaseHeight, enableWaves },
        containerElem,
        width,
        height
      ) {
        this.textString = text;
        this.asciiFontSize = asciiFontSize;
        this.textFontSize = textFontSize;
        this.textColor = textColor;
        this.planeBaseHeight = planeBaseHeight;
        this.container = containerElem;
        this.width = width;
        this.height = height;
        this.enableWaves = enableWaves;

        this.camera = new THREE.PerspectiveCamera(45, this.width / this.height, 1, 1000);
        this.camera.position.z = 30;

        this.scene = new THREE.Scene();
        this.mouse = { x: this.width / 2, y: this.height / 2 };

        this.onMouseMove = this.onMouseMove.bind(this);
      }

      async init() {
        try {
          await document.fonts.load('600 200px "IBM Plex Mono"');
          await document.fonts.load('500 12px "IBM Plex Mono"');
        } catch (e) {}
        await document.fonts.ready;

        this.setMesh();
        this.setRenderer();
      }

      setMesh() {
        this.textCanvas = new CanvasTxt(this.textString, {
          fontSize: this.textFontSize,
          fontFamily: 'IBM Plex Mono',
          color: this.textColor
        });
        this.textCanvas.resize();
        this.textCanvas.render();

        this.texture = new THREE.CanvasTexture(this.textCanvas.texture);
        this.texture.minFilter = THREE.NearestFilter;

        const textAspect = this.textCanvas.width / this.textCanvas.height;
        const baseH = this.planeBaseHeight;
        const planeW = baseH * textAspect;
        const planeH = baseH;

        const vertexShader = `
          varying vec2 vUv;
          uniform float uTime;
          uniform float mouse;
          uniform float uEnableWaves;

          void main() {
            vUv = uv;
            float time = uTime * 5.;
            float waveFactor = uEnableWaves;
            vec3 transformed = position;
            transformed.x += sin(time + position.y) * 0.5 * waveFactor;
            transformed.y += cos(time + position.z) * 0.15 * waveFactor;
            transformed.z += sin(time + position.x) * waveFactor;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(transformed, 1.0);
          }
        `;

        const fragmentShader = `
          varying vec2 vUv;
          uniform float mouse;
          uniform float uTime;
          uniform sampler2D uTexture;

          void main() {
            float time = uTime;
            vec2 pos = vUv;
            float move = sin(time + mouse) * 0.01;
            float r = texture2D(uTexture, pos + cos(time * 2. - time + pos.x) * .01).r;
            float g = texture2D(uTexture, pos + tan(time * .5 + pos.x - time) * .01).g;
            float b = texture2D(uTexture, pos - cos(time * 2. + time + pos.y) * .01).b;
            float a = texture2D(uTexture, pos).a;
            gl_FragColor = vec4(r, g, b, a);
          }
        `;

        this.geometry = new THREE.PlaneGeometry(planeW, planeH, 36, 36);
        this.material = new THREE.ShaderMaterial({
          vertexShader,
          fragmentShader,
          transparent: true,
          uniforms: {
            uTime: { value: 0 },
            mouse: { value: 1.0 },
            uTexture: { value: this.texture },
            uEnableWaves: { value: this.enableWaves ? 1.0 : 0.0 }
          }
        });

        this.mesh = new THREE.Mesh(this.geometry, this.material);
        this.scene.add(this.mesh);
      }

      setRenderer() {
        this.renderer = new THREE.WebGLRenderer({ antialias: false, alpha: true });
        this.renderer.setPixelRatio(1);
        this.renderer.setClearColor(0x000000, 0);

        this.filter = new AsciiFilter(this.renderer, {
          fontFamily: 'IBM Plex Mono',
          fontSize: this.asciiFontSize,
          invert: true
        });

        this.container.appendChild(this.filter.domElement);
        this.setSize(this.width, this.height);

        this.container.addEventListener('mousemove', this.onMouseMove);
        this.container.addEventListener('touchmove', this.onMouseMove);
      }

      setSize(w, h) {
        this.width = w;
        this.height = h;

        this.camera.aspect = w / h;
        this.camera.updateProjectionMatrix();

        this.filter.setSize(w, h);

        this.center = { x: w / 2, y: h / 2 };
      }

      load() {
        this.animate();
      }

      onMouseMove(evt) {
        const e = evt.touches ? evt.touches[0] : evt;
        const bounds = this.container.getBoundingClientRect();
        const x = e.clientX - bounds.left;
        const y = e.clientY - bounds.top;
        this.mouse = { x, y };
      }

      animate() {
        const animateFrame = () => {
          this.animationFrameId = requestAnimationFrame(animateFrame);
          this.render();
        };
        animateFrame();
      }

      render() {
        const time = new Date().getTime() * 0.001;

        this.textCanvas.render();
        this.texture.needsUpdate = true;

        this.mesh.material.uniforms.uTime.value = Math.sin(time);

        this.updateRotation();
        this.filter.render(this.scene, this.camera);
      }

      updateRotation() {
        const x = Math.map(this.mouse.y, 0, this.height, 0.5, -0.5);
        const y = Math.map(this.mouse.x, 0, this.width, -0.5, 0.5);

        this.mesh.rotation.x += (x - this.mesh.rotation.x) * 0.05;
        this.mesh.rotation.y += (y - this.mesh.rotation.y) * 0.05;
      }

      clear() {
        this.scene.traverse(obj => {
          if (obj.isMesh && typeof obj.material === 'object' && obj.material !== null) {
            Object.keys(obj.material).forEach(key => {
              const matProp = obj.material[key];
              if (matProp !== null && typeof matProp === 'object' && typeof matProp.dispose === 'function') {
                matProp.dispose();
              }
            });
            obj.material.dispose();
            obj.geometry.dispose();
          }
        });
        this.scene.clear();
      }

      dispose() {
        cancelAnimationFrame(this.animationFrameId);
        if (this.filter) {
          this.filter.dispose();
          if (this.filter.domElement.parentNode) {
            this.container.removeChild(this.filter.domElement);
          }
        }
        this.container.removeEventListener('mousemove', this.onMouseMove);
        this.container.removeEventListener('touchmove', this.onMouseMove);
        this.clear();
        if (this.renderer) {
          this.renderer.dispose();
          this.renderer.forceContextLoss();
        }
      }
    }

    function ASCIIText({
      text = 'Welcome',
      asciiFontSize = 11,
      textFontSize = 120,
      textColor = '#fdf9f3',
      planeBaseHeight = 5,
      enableWaves = false
    }) {
      const containerRef = useRef(null);
      const asciiRef = useRef(null);

      useEffect(() => {
        if (!containerRef.current) return;

        let cancelled = false;
        let observer = null;
        let ro = null;

        const createAndInit = async (container, w, h) => {
          const instance = new CanvAscii(
            { text, asciiFontSize, textFontSize, textColor, planeBaseHeight, enableWaves },
            container,
            w,
            h
          );
          await instance.init();
          return instance;
        };

        const setup = async () => {
          const { width, height } = containerRef.current.getBoundingClientRect();

          if (width === 0 || height === 0) {
            observer = new IntersectionObserver(
              async ([entry]) => {
                if (cancelled) return;
                if (entry.isIntersecting && entry.boundingClientRect.width > 0 && entry.boundingClientRect.height > 0) {
                  const { width: w, height: h } = entry.boundingClientRect;
                  observer.disconnect();
                  observer = null;

                  if (!cancelled) {
                    asciiRef.current = await createAndInit(containerRef.current, w, h);
                    if (!cancelled && asciiRef.current) {
                      asciiRef.current.load();
                    }
                  }
                }
              },
              { threshold: 0.1 }
            );
            observer.observe(containerRef.current);
            return;
          }

          asciiRef.current = await createAndInit(containerRef.current, width, height);
          if (!cancelled && asciiRef.current) {
            asciiRef.current.load();

            ro = new ResizeObserver(entries => {
              if (!entries[0] || !asciiRef.current) return;
              const { width: w, height: h } = entries[0].contentRect;
              if (w > 0 && h > 0) {
                asciiRef.current.setSize(w, h);
              }
            });
            ro.observe(containerRef.current);
          }
        };

        setup();

        return () => {
          cancelled = true;
          if (observer) observer.disconnect();
          if (ro) ro.disconnect();
          if (asciiRef.current) {
            asciiRef.current.dispose();
            asciiRef.current = null;
          }
        };
      }, [text, asciiFontSize, textFontSize, textColor, planeBaseHeight, enableWaves]);

      return (
        <div
          ref={containerRef}
          className="ascii-text-container"
          style={{
            position: 'absolute',
            width: '100%',
            height: '100%'
          }}
        />
      );
    }

    // ── TextPressure (from reactbits.dev) ──────────────────────────────────────
    const dist = (a, b) => {
      const dx = b.x - a.x;
      const dy = b.y - a.y;
      return Math.sqrt(dx * dx + dy * dy);
    };

    const getAttr = (distance, maxDist, minVal, maxVal) => {
      const val = maxVal - Math.abs((maxVal * distance) / maxDist);
      return Math.max(minVal, val + minVal);
    };

    const debounce = (func, delay) => {
      let timeoutId;
      return (...args) => {
        clearTimeout(timeoutId);
        timeoutId = setTimeout(() => func(...args), delay);
      };
    };

    function TextPressure({
      text = 'Compressa',
      fontFamily = 'Compressa VF',
      fontUrl = 'https://res.cloudinary.com/dr6lvwubh/raw/upload/v1529908256/CompressaPRO-GX.woff2',
      width = true,
      weight = true,
      italic = true,
      alpha = false,
      flex = true,
      stroke = false,
      scale = false,
      textColor = '#FFFFFF',
      strokeColor = '#FF0000',
      className = '',
      minFontSize = 24
    }) {
      const containerRef = useRef(null);
      const titleRef = useRef(null);
      const spansRef = useRef([]);
      const mouseRef = useRef({ x: 0, y: 0 });
      const cursorRef = useRef({ x: 0, y: 0 });
      const [fontSize, setFontSize] = useState(minFontSize);
      const [scaleY, setScaleY] = useState(1);
      const [lineHeight, setLineHeight] = useState(1);
      const chars = text.split('');

      useEffect(() => {
        const handleMouseMove = e => {
          cursorRef.current.x = e.clientX;
          cursorRef.current.y = e.clientY;
        };
        const handleTouchMove = e => {
          const t = e.touches[0];
          cursorRef.current.x = t.clientX;
          cursorRef.current.y = t.clientY;
        };

        window.addEventListener('mousemove', handleMouseMove);
        window.addEventListener('touchmove', handleTouchMove, { passive: true });

        if (containerRef.current) {
          const { left, top, width: w, height: h } = containerRef.current.getBoundingClientRect();
          mouseRef.current.x = left + w / 2;
          mouseRef.current.y = top + h / 2;
          cursorRef.current.x = mouseRef.current.x;
          cursorRef.current.y = mouseRef.current.y;
        }

        return () => {
          window.removeEventListener('mousemove', handleMouseMove);
          window.removeEventListener('touchmove', handleTouchMove);
        };
      }, []);

      const setSize = useCallback(() => {
        if (!containerRef.current || !titleRef.current) return;
        const { width: containerW, height: containerH } = containerRef.current.getBoundingClientRect();
        let newFontSize = containerW / (chars.length / 2);
        newFontSize = Math.max(newFontSize, minFontSize);
        setFontSize(newFontSize);
        setScaleY(1);
        setLineHeight(1);

        requestAnimationFrame(() => {
          if (!titleRef.current) return;
          const textRect = titleRef.current.getBoundingClientRect();
          if (scale && textRect.height > 0) {
            const yRatio = containerH / textRect.height;
            setScaleY(yRatio);
            setLineHeight(yRatio);
          }
        });
      }, [chars.length, minFontSize, scale]);

      useEffect(() => {
        const debouncedSetSize = debounce(setSize, 100);
        debouncedSetSize();
        window.addEventListener('resize', debouncedSetSize);
        return () => window.removeEventListener('resize', debouncedSetSize);
      }, [setSize]);

      useEffect(() => {
        let rafId;
        const animate = () => {
          mouseRef.current.x += (cursorRef.current.x - mouseRef.current.x) / 15;
          mouseRef.current.y += (cursorRef.current.y - mouseRef.current.y) / 15;

          if (titleRef.current) {
            const titleRect = titleRef.current.getBoundingClientRect();
            const maxDist = titleRect.width / 2;

            spansRef.current.forEach(span => {
              if (!span) return;
              const rect = span.getBoundingClientRect();
              const charCenter = { x: rect.x + rect.width / 2, y: rect.y + rect.height / 2 };
              const d = dist(mouseRef.current, charCenter);
              const wdth = width ? Math.floor(getAttr(d, maxDist, 5, 200)) : 100;
              const wght = weight ? Math.floor(getAttr(d, maxDist, 100, 900)) : 400;
              const italVal = italic ? getAttr(d, maxDist, 0, 1).toFixed(2) : 0;
              const alphaVal = alpha ? getAttr(d, maxDist, 0, 1).toFixed(2) : 1;
              const newFontVariationSettings = `'wght' ${wght}, 'wdth' ${wdth}, 'ital' ${italVal}`;

              if (span.style.fontVariationSettings !== newFontVariationSettings) {
                span.style.fontVariationSettings = newFontVariationSettings;
              }
              if (alpha && span.style.opacity !== alphaVal) {
                span.style.opacity = alphaVal;
              }
            });
          }

          rafId = requestAnimationFrame(animate);
        };
        animate();
        return () => cancelAnimationFrame(rafId);
      }, [width, weight, italic, alpha]);

      const styleElement = useMemo(() => (
        <style>{`
          @font-face {
            font-family: '${fontFamily}';
            src: url('${fontUrl}');
            font-style: normal;
          }
          .text-pressure-flex { display: flex; justify-content: space-between; }
          .text-pressure-stroke span { position: relative; color: ${textColor}; }
          .text-pressure-stroke span::after {
            content: attr(data-char);
            position: absolute;
            left: 0; top: 0;
            color: transparent;
            z-index: -1;
            -webkit-text-stroke-width: 3px;
            -webkit-text-stroke-color: ${strokeColor};
          }
          .text-pressure-title { color: ${textColor}; }
        `}</style>
      ), [fontFamily, fontUrl, textColor, strokeColor]);

      const dynamicClassName = [
        'text-pressure-title',
        className,
        flex ? 'text-pressure-flex' : '',
        stroke ? 'text-pressure-stroke' : ''
      ].filter(Boolean).join(' ');

      return (
        <div ref={containerRef} style={{ position: 'relative', width: '100%', height: '100%' }}>
          {styleElement}
          <h1
            ref={titleRef}
            className={dynamicClassName}
            style={{
              fontFamily,
              fontSize,
              lineHeight,
              transform: `scale(1, ${scaleY})`,
              transformOrigin: 'center top',
              margin: 0,
              fontWeight: 100,
              fontStyle: 'normal',
              width: '100%',
              ...(flex ? {} : { whiteSpace: 'nowrap' })
            }}
          >
            {chars.map((char, i) => (
              <span
                key={i}
                ref={el => { spansRef.current[i] = el; }}
                data-char={char}
                style={{ display: 'inline-block', color: stroke ? undefined : textColor }}
              >
                {char}
              </span>
            ))}
          </h1>
        </div>
      );
    }

    // ── Aurora background ────────────────────────────
    function Aurora() {
      return (
        <div className="aurora-bg">
          <div className="aurora-layer" />
          <div className="aurora-layer aurora-layer-2" />
        </div>
      );
    }

    // ── App ───────────────────────────────────────────────────────────────
    function App() {
      return (
        <>
          <Aurora />

          <main className="page">
            <section className="ascii-text-section">
              <ASCIIText
                text="Welcome"
                asciiFontSize={11}
                textFontSize={120}
                textColor="#fdf9f3"
                planeBaseHeight={5}
                enableWaves={false}
              />
            </section>

            <section className="text-pressure-section">
              <div className="text-pressure-inner">
                <TextPressure
                  text="STAR"
                  width={true}
                  weight={true}
                  italic={true}
                  flex={true}
                  textColor="#FFFFFF"
                  minFontSize={8}
                />
              </div>
            </section>

            <p className="footer">
              from <a href="https://reactbits.dev/">reactbits.dev</a>
            </p>
          </main>
        </>
      );
    }

    try {
      if (!window.React || !window.ReactDOM) {
        throw new Error('React failed to load. Check your internet connection and refresh.');
      }
      createRoot(document.getElementById('root')).render(<App />);
    } catch (err) {
      console.error('Failed to load page:', err.message);
    }
  </script>
</body>
</html>
