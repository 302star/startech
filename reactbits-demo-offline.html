<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>React Bits Demo - Offline</title>
    <style>
      html,body,#root{height:100%;margin:0;font-family:system-ui,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:#0f1720;color:#e6eef8}
      .app{padding:24px;max-width:1100px;margin:0 auto}
      .header{display:flex;align-items:center;gap:16px}
      .logo{width:56px;height:56px;background:linear-gradient(135deg,#7c3aed,#06b6d4);border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:700}
      .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;margin-top:18px}
      .card{border-radius:12px;padding:14px;background:linear-gradient(180deg,rgba(255,255,255,0.02),rgba(255,255,255,0.01));box-shadow:0 6px 30px rgba(2,6,23,0.6);min-height:140px}
      .center{display:flex;align-items:center;justify-content:center}
      .small{font-size:13px;opacity:0.8}
      .btn{cursor:pointer;background:#06b6d4;color:#041024;padding:10px 14px;border-radius:10px;font-weight:600;border:none}
      img{max-width:100%;height:auto;border-radius:8px}

      /* animated gradient for headings */
      .animated-gradient{ background-image: linear-gradient(90deg,#7c3aed,#06b6d4); background-size:200% 200%; background-repeat:no-repeat; animation:gradientMove 4s linear infinite; -webkit-background-clip:text; color:transparent; }
      @keyframes gradientMove{ 0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%} }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <!-- Local offline vendor scripts -->
    <script src="vendor/react.production.min.js"></script>
    <script src="vendor/react-dom.production.min.js"></script>
    <script src="vendor/react-bits-shim.js"></script>

    <script>
      // Fallback DOM renderer (used if React or ReactDOM is missing or broken)
      function renderFallback() {
        const root = document.getElementById('root');
        root.innerHTML = '';
        const app = document.createElement('div'); app.className = 'app';

        const header = document.createElement('div'); header.className = 'header';
        const logo = document.createElement('div'); logo.className = 'logo center'; logo.textContent = 'RB';
        const headerText = document.createElement('div');
        const h2 = document.createElement('h2'); h2.style.margin = '0'; h2.style.letterSpacing = '0.2px'; h2.style.fontSize = '20px'; h2.textContent = 'React Bits — Demo (Offline)';
        const small = document.createElement('div'); small.className = 'small'; small.textContent = 'Offline bundle with react-bits shim';
        headerText.appendChild(h2); headerText.appendChild(small);
        header.appendChild(logo); header.appendChild(headerText);

        const grid = document.createElement('div'); grid.className = 'grid';

        // Profile card
        const card1 = document.createElement('div'); card1.className = 'card';
        const pc = document.createElement('div'); pc.style.display = 'flex'; pc.style.gap = '12px'; pc.style.alignItems = 'center';
        const avatarWrap = document.createElement('div'); avatarWrap.style.width = '72px'; avatarWrap.style.height = '72px'; avatarWrap.style.borderRadius = '12px'; avatarWrap.style.overflow = 'hidden';
        const img = document.createElement('img'); img.src = 'https://images.unsplash.com/photo-1545996124-6d1f75fceaa7?auto=format&fit=crop&w=256&q=60'; img.style.width='100%'; img.style.height='100%'; img.style.objectFit='cover';
        avatarWrap.appendChild(img);
        const txtWrap = document.createElement('div');
        const name = document.createElement('div'); name.style.fontSize='18px'; name.style.fontWeight='700'; name.textContent='Ava Example';
        const role = document.createElement('div'); role.style.fontSize='13px'; role.style.opacity='0.8'; role.textContent='Creative engineer • react-bits fan';
        txtWrap.appendChild(name); txtWrap.appendChild(role);
        pc.appendChild(avatarWrap); pc.appendChild(txtWrap);
        card1.appendChild(pc);

        // Animated counter (simple)
        const card2 = document.createElement('div'); card2.className = 'card';
        const acLabel = document.createElement('div'); acLabel.style.fontSize='14px'; acLabel.style.opacity='0.9'; acLabel.textContent='Animated Counter (press +):';
        const acRow = document.createElement('div'); acRow.style.display='flex'; acRow.style.alignItems='center'; acRow.style.gap='10px';
        const counter = document.createElement('div'); counter.style.fontSize='28px'; counter.textContent='0';
        const btn = document.createElement('button'); btn.className='btn'; btn.textContent='+'; btn.onclick = ()=>{
          const from = Number(counter.textContent||0);
          const to = from + 1;
          const start = Date.now();
          const dur = 700;
          function step(){
            const t = Date.now() - start;
            const p = Math.min(1, t / dur);
            const cur = Math.round(from + (to - from) * p);
            counter.textContent = String(cur);
            if(p < 1) requestAnimationFrame(step);
          }
          requestAnimationFrame(step);
        };
        acRow.appendChild(counter); acRow.appendChild(btn);
        card2.appendChild(acLabel); card2.appendChild(acRow);

        // Gallery
        const card3 = document.createElement('div'); card3.className='card';
        const gLabel = document.createElement('div'); gLabel.style.fontSize='14px'; gLabel.style.opacity='0.9'; gLabel.style.marginBottom='8px'; gLabel.textContent='Image Gallery (click thumbnails)';
        const gMain = document.createElement('div'); gMain.style.display='grid'; gMain.style.gridTemplateColumns='1fr'; gMain.style.gap='8px';
        const shots = ['https://images.unsplash.com/photo-1503023345310-bd7c1de61c7d?w=800&q=60','https://images.unsplash.com/photo-1517694712202-14dd9538aa97?w=800&q=60','https://images.unsplash.com/photo-1502767089025-6572583495b0?w=800&q=60'];
        let current = 0;
        const mainImg = document.createElement('img'); mainImg.src = shots[0]; mainImg.style.height='160px'; mainImg.style.width='100%'; mainImg.style.objectFit='cover'; mainImg.style.borderRadius='10px';
        const thumbs = document.createElement('div'); thumbs.style.display='flex'; thumbs.style.gap='8px';
        shots.forEach((s,idx)=>{ const t = document.createElement('img'); t.src=s; t.style.width='86px'; t.style.height='56px'; t.style.objectFit='cover'; t.style.borderRadius='8px'; t.style.border = idx===0? '2px solid #06b6d4':'2px solid transparent'; t.onclick=()=>{ mainImg.src=s; thumbs.querySelectorAll('img').forEach((im,i)=>im.style.border = i===idx?'2px solid #06b6d4':'2px solid transparent'); }; thumbs.appendChild(t); });
        gMain.appendChild(mainImg); gMain.appendChild(thumbs);
        card3.appendChild(gLabel); card3.appendChild(gMain);

        // Menu
        const card4 = document.createElement('div'); card4.className='card';
        const menuTitle = document.createElement('div'); menuTitle.style.fontSize='16px'; menuTitle.style.fontWeight='700'; menuTitle.style.marginBottom='8px'; menuTitle.textContent='Interactive Menu (using Touchable)';
        const menuWrap = document.createElement('div'); menuWrap.style.display='flex'; menuWrap.style.gap='8px'; menuWrap.style.flexWrap='wrap';
        ['Home','Explore','Collections','About'].forEach(label=>{ const b=document.createElement('button'); b.className='btn'; b.style.background='#7c3aed'; b.style.color='#fff'; b.textContent=label; b.onclick=()=>alert(label+' clicked'); menuWrap.appendChild(b); });
        card4.appendChild(menuTitle); card4.appendChild(menuWrap);

        // Text styles card
        const card5 = document.createElement('div'); card5.className='card';
        const tTitle = document.createElement('div'); tTitle.style.fontSize='16px'; tTitle.style.fontWeight='700'; tTitle.style.marginBottom='8px'; tTitle.textContent='Demo Text Styles';
        const grad = document.createElement('div'); grad.className = 'animated-gradient'; grad.style.fontSize='24px'; grad.style.fontWeight='800'; grad.textContent='Gradient Heading';
        // pressure interaction for fallback
        grad.addEventListener('pointerdown', function(e){ const p = (typeof e.pressure === 'number')? e.pressure : 0.5; grad.style.transform = 'scale('+ (1 - Math.min(0.12,0.08*p)) +')'; grad.setPointerCapture && grad.setPointerCapture(e.pointerId); });
        grad.addEventListener('pointermove', function(e){ if(e.pressure!==undefined){ const p = e.pressure; grad.style.transform = 'scale('+ (1 - Math.min(0.12,0.08*p)) +')'; } });
        grad.addEventListener('pointerup', function(e){ grad.style.transform = 'scale(1)'; try{ grad.releasePointerCapture && grad.releasePointerCapture(e.pointerId);}catch(_){} });
        const p = document.createElement('div'); p.style.marginTop='8px'; p.style.opacity='0.9'; p.textContent='Regular paragraph sample — shows how Text and View compose.';
        card5.appendChild(tTitle); card5.appendChild(grad); card5.appendChild(p);

        grid.appendChild(card1); grid.appendChild(card2); grid.appendChild(card3); grid.appendChild(card4); grid.appendChild(card5);

        const notes = document.createElement('div'); notes.style.marginTop='18px'; notes.style.display='flex'; notes.style.gap='12px'; notes.style.alignItems='center';
        const nlabel = document.createElement('div'); nlabel.className='small'; nlabel.textContent='Notes:';
        const ntext = document.createElement('div'); ntext.className='small'; ntext.style.opacity='0.8'; ntext.textContent='This offline demo bundles a minimal React UMD and a tiny react-bits shim. Images still load from network.';
        notes.appendChild(nlabel); notes.appendChild(ntext);

        app.appendChild(header); app.appendChild(grid); app.appendChild(notes);
        root.appendChild(app);
      }

      // Use React if available, otherwise fallback
      (function(){
        try {
          if(window.React && window.ReactDOM && window.ReactBits){
            const React = window.React;
            const ReactDOM = window.ReactDOM;
            const RB = window.ReactBits || {};
            const { View, Text, Image, Touchable, Animated, PressureText, TextPressure, BlurText, ShinyText, SpotlightCard, ClickSpark, StarBorder } = RB;
            const { useRef, useEffect, useState } = React;

            // Simple Aurora component (CSS-driven)
            function Aurora(){
              return React.createElement('div', { className: 'aurora-bg' },
                React.createElement('div', { className: 'aurora-layer' }),
                React.createElement('div', { className: 'aurora-layer aurora-layer-2' })
              );
            }

            function AnimatedCounter(){
              // rAF-driven animation to ensure it animates reliably
              const [n, setN] = useState(0);
              const [display, setDisplay] = useState(0);
              const rafRef = useRef(null);
              const fromRef = useRef(0);
              useEffect(()=>{
                const from = fromRef.current;
                const to = n;
                const start = Date.now();
                const dur = 700;
                function tick(){
                  const t = Date.now() - start;
                  const p = Math.min(1, t / dur);
                  const cur = Math.round(from + (to - from) * p);
                  setDisplay(cur);
                  if(p < 1) rafRef.current = requestAnimationFrame(tick);
                }
                rafRef.current = requestAnimationFrame(tick);
                return ()=>{ if(rafRef.current) cancelAnimationFrame(rafRef.current); };
              },[n]);

              function increment(){ fromRef.current = display; setN(x=>x+1); }

              return React.createElement(View, { style: { display: 'flex', flexDirection: 'column', gap: 10 } },
                React.createElement(Text, { style: { fontSize: 14, opacity: 0.9 } }, 'Animated Counter (press +):'),
                React.createElement(View, { style: { display: 'flex', alignItems: 'center', gap: 10 } },
                  React.createElement(Text, { style: { fontSize: 28 } }, display),
                  React.createElement(Touchable, { onPress: increment }, React.createElement('button', { className: 'btn' }, '+'))
                )
              );
            }

            function ProfileCard(){
              return React.createElement(View, { style: { display: 'flex', flexDirection: 'row', gap: 12, alignItems: 'center' } },
                React.createElement(View, { style: { width: 72, height: 72, borderRadius: 12, overflow: 'hidden', flexShrink: 0 } },
                  React.createElement(Image, { source: { uri: 'https://images.unsplash.com/photo-1545996124-6d1f75fceaa7?auto=format&fit=crop&w=256&q=60' }, style: { width: '100%', height: '100%', objectFit: 'cover' } })
                ),
                React.createElement(View, null,
                  React.createElement(Text, { style: { fontSize: 18, fontWeight: 700 } }, 'Ava Example'),
                  React.createElement(Text, { style: { fontSize: 13, opacity: 0.8 } }, 'Creative engineer • react-bits fan')
                )
              );
            }

            function Gallery(){
              const shots = [
                'https://images.unsplash.com/photo-1503023345310-bd7c1de61c7d?w=800&q=60',
                'https://images.unsplash.com/photo-1517694712202-14dd9538aa97?w=800&q=60',
                'https://images.unsplash.com/photo-1502767089025-6572583495b0?w=800&q=60'
              ];
              const [i,setI] = useState(0);
              return React.createElement(View, null,
                React.createElement(Text, { style: { fontSize: 14, opacity: 0.9, marginBottom: 8 } }, 'Image Gallery (click thumbnails)'),
                React.createElement(View, { style: { display: 'grid', gridTemplateColumns: '1fr', gap: 8 } },
                  React.createElement(Image, { source: { uri: shots[i] }, style: { width: '100%', height: 160, borderRadius: 10, objectFit: 'cover' } }),
                  React.createElement(View, { style: { display: 'flex', gap: 8 } },
                    shots.map((s,idx)=>React.createElement(Touchable,{ key: s, onPress: ()=>setI(idx) },
                      React.createElement('img',{ src: s, style: { width: 86, height: 56, objectFit: 'cover', borderRadius: 8, border: idx===i? '2px solid #06b6d4' : '2px solid transparent' } })
                    ))
                  )
                )
              );
            }

            function App(){
              return React.createElement(View, { style: { padding: 0 } },
                React.createElement('div', { className: 'app' },
                  React.createElement(Aurora, null),
                  React.createElement(BlurText, { text: 'Animated UI Components', className: 'hero-title', delay: 80, animateBy: 'words', direction: 'top' }),
                  React.createElement('div', { className: 'shiny-wrap' }, React.createElement(ShinyText, { text: 'Shiny metallic text effect' })),

                  React.createElement('div', { className: 'grid' },
                    React.createElement('div', { className: 'card' }, React.createElement(ProfileCard, null)),
                    React.createElement('div', { className: 'card' }, React.createElement(AnimatedCounter, null)),
                    React.createElement('div', { className: 'card' }, React.createElement(Gallery, null)),
                    React.createElement('div', { className: 'card' },
                      React.createElement(Text, { style: { fontSize: 16, fontWeight: 700, marginBottom: 8 } }, 'Interactive Menu (using Touchable)'),
                      React.createElement(View, { style: { display: 'flex', gap: 8, flexWrap: 'wrap' } },
                        ['Home','Explore','Collections','About'].map(label=>React.createElement(Touchable,{ key: label, onPress: ()=>alert(label+' clicked') }, React.createElement('button',{ className: 'btn', style:{ background: '#7c3aed', color: '#fff' } }, label)))
                      )
                    ),
                    React.createElement('div', { className: 'card' },
                      React.createElement('div', { style: { fontSize: 16, fontWeight: 700, marginBottom: 8 } }, 'Demo Text Styles'),
                      React.createElement('div', { style: { height: 140 } }, React.createElement(TextPressure, { text: 'STAR', width: true, weight: true, italic: true, flex: true, textColor: '#FFFFFF', minFontSize: 10 })),
                      React.createElement(Text, { style: { marginTop: 8, opacity: 0.9 } }, 'Regular paragraph sample — shows how Text and View compose.')
                    )
                  ),

                  React.createElement('div', { style: { marginTop: 18, display: 'flex', gap: 12, alignItems: 'center' } },
                    React.createElement(Text, { className: 'small' }, 'Notes:'),
                    React.createElement(Text, { className: 'small', style: { opacity: 0.8 } }, 'This offline demo bundles a minimal React UMD and a tiny react-bits shim. Images still load from network.')
                  ),

                  React.createElement('div', { className: 'cards' },
                    React.createElement(SpotlightCard, { spotlightColor: 'rgba(99, 102, 241, 0.35)' }, React.createElement('div', { className: 'card-icon' }, '✨'), React.createElement('h3', null, 'Spotlight Card'), React.createElement('p', null, 'Move your cursor over this card — a soft spotlight follows your mouse.')),
                    React.createElement(SpotlightCard, { spotlightColor: 'rgba(236, 72, 153, 0.35)' }, React.createElement('div', { className: 'card-icon' }, '🌊'), React.createElement('h3', null, 'Aurora Background'), React.createElement('p', null, 'The flowing aurora behind this page is inspired by the React Bits Aurora component.')),
                    React.createElement(SpotlightCard, { spotlightColor: 'rgba(34, 211, 238, 0.35)' }, React.createElement('div', { className: 'card-icon' }, '🔤'), React.createElement('h3', null, 'Text Pressure'), React.createElement('p', null, 'Characters warp and scale based on cursor proximity.'))
                  ),

                  React.createElement('div', { className: 'cta-section' },
                    React.createElement('p', { className: 'cta-hint' }, 'Click the button for spark particles'),
                    React.createElement(ClickSpark, { sparkColor: '#7cff67', sparkCount: 12, sparkRadius: 20 }, React.createElement(StarBorder, { color: '#7cff67', speed: '5s' }, 'Explore React Bits'))
                  )

                )
              );
            }

            ReactDOM.render(React.createElement(App,null), document.getElementById('root'));
          } else {
            renderFallback();
          }
        } catch (err) {
          console.warn('React render failed, using fallback:', err);
          renderFallback();
        }
      })();
    </script>
  </body>
</html>
